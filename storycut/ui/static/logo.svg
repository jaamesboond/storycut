<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>storycut</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16091f"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="pk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5fb4"/>
      <stop offset="1" stop-color="#ff2e97"/>
    </linearGradient>
    <linearGradient id="gr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8dff6a"/>
      <stop offset="1" stop-color="#39ff14"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sq"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
  </defs>

  <!-- app tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#sq)" opacity="0.18" stroke="#00e5ff" stroke-width="2">
    <path d="M16 136H496M16 256H496M16 376H496M136 16V496M256 16V496M376 16V496"/>
  </g>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#pk)" stroke-width="6" filter="url(#soft)" opacity="0.9"/>

  <!-- film strip: the long stream -->
  <g transform="rotate(-14 256 256)" filter="url(#soft)">
    <rect x="40" y="196" width="432" height="120" rx="22" fill="#0d0f16" stroke="url(#pk)" stroke-width="8"/>
    <g fill="#ff2e97">
      <rect x="62" y="208" width="22" height="16" rx="4"/><rect x="104" y="208" width="22" height="16" rx="4"/>
      <rect x="146" y="208" width="22" height="16" rx="4"/><rect x="344" y="208" width="22" height="16" rx="4"/>
      <rect x="386" y="208" width="22" height="16" rx="4"/><rect x="428" y="208" width="22" height="16" rx="4"/>
      <rect x="62" y="288" width="22" height="16" rx="4"/><rect x="104" y="288" width="22" height="16" rx="4"/>
      <rect x="146" y="288" width="22" height="16" rx="4"/><rect x="344" y="288" width="22" height="16" rx="4"/>
      <rect x="386" y="288" width="22" height="16" rx="4"/><rect x="428" y="288" width="22" height="16" rx="4"/>
    </g>
    <!-- the story window that gets cut out -->
    <rect x="186" y="180" width="140" height="152" rx="18" fill="none" stroke="url(#gr)" stroke-width="9"
          stroke-dasharray="20 12" filter="url(#glow)"/>
  </g>

  <!-- play button = the payoff -->
  <path d="M232 214 L306 256 L232 298 Z" fill="url(#gr)" stroke="#d9ffcf" stroke-width="6" stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- sparkle -->
  <g fill="#ffffff" filter="url(#soft)">
    <path d="M384 92 l9 25 25 9 -25 9 -9 25 -9 -25 -25 -9 25 -9z" fill="#39ff14"/>
    <path d="M126 380 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z" fill="#ff2e97"/>
    <circle cx="104" cy="132" r="7" fill="#00e5ff"/>
  </g>
</svg>
