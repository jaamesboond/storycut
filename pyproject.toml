[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "storycut"
version = "0.1.0"
description = "Find full-story clip windows (setup -> build -> payoff) in long livestreams and VODs."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["faster-whisper>=1.0", "numpy>=1.24"]

[project.optional-dependencies]
url = ["yt-dlp"]

[project.scripts]
storycut = "storycut.cli:main"

[tool.setuptools]
packages = ["storycut"]
